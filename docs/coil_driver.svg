<svg width="720" height="470" viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" font-family="Menlo,Consolas,monospace">
  <rect width="720" height="470" rx="14" fill="#0B0E14"/>
  <text x="28" y="44" fill="#E6B450" font-size="22" font-weight="700">Single Coil Driver  (×4)</text>
  <text x="28" y="66" fill="#6B7280" font-size="13">STM32 pin → 2N2222 gate driver → N-MOSFET → coil, with flyback protection</text>

  <!-- +12V rail -->
  <line x1="70" y1="120" x2="650" y2="120" stroke="#E6B450" stroke-width="2.5"/>
  <text x="70" y="110" fill="#E6B450" font-size="14">+12V</text>
  <!-- GND rail -->
  <line x1="70" y1="420" x2="650" y2="420" stroke="#4B5563" stroke-width="2.5"/>
  <text x="70" y="440" fill="#9CA3AF" font-size="14">GND (common with STM32)</text>

  <!-- Coil -->
  <line x1="180" y1="120" x2="180" y2="160" stroke="#C5C8C6" stroke-width="1.6"/>
  <rect x="150" y="160" width="60" height="60" rx="8" fill="none" stroke="#E6B450" stroke-width="2"/>
  <text x="180" y="188" fill="#E6B450" font-size="13" text-anchor="middle">COIL</text>
  <text x="180" y="206" fill="#6B7280" font-size="11" text-anchor="middle">~120T</text>
  <line x1="180" y1="220" x2="180" y2="250" stroke="#C5C8C6" stroke-width="1.6"/>
  <circle cx="180" cy="245" r="4" fill="#4B5563"/>
  <text x="130" y="249" fill="#9CA3AF" font-size="12" text-anchor="end">drain</text>

  <!-- MOSFET -->
  <rect x="148" y="270" width="64" height="70" rx="8" fill="none" stroke="#60A5FA" stroke-width="2"/>
  <text x="180" y="298" fill="#60A5FA" font-size="12" text-anchor="middle">MOSFET</text>
  <text x="180" y="316" fill="#6B7280" font-size="11" text-anchor="middle">D top</text>
  <text x="180" y="330" fill="#6B7280" font-size="11" text-anchor="middle">S bottom</text>
  <line x1="180" y1="250" x2="180" y2="270" stroke="#C5C8C6" stroke-width="1.6"/>
  <line x1="180" y1="340" x2="180" y2="420" stroke="#C5C8C6" stroke-width="1.6"/>
  <line x1="148" y1="305" x2="120" y2="305" stroke="#C5C8C6" stroke-width="1.6"/>
  <text x="132" y="298" fill="#9CA3AF" font-size="12" text-anchor="end">gate</text>

  <!-- Flyback diode across coil -->
  <line x1="300" y1="120" x2="300" y2="168" stroke="#C5C8C6" stroke-width="1.6"/>
  <line x1="284" y1="168" x2="316" y2="168" stroke="#F87171" stroke-width="2.4"/>
  <path d="M300 172 L288 198 L312 198 Z" fill="none" stroke="#F87171" stroke-width="2.2"/>
  <line x1="300" y1="198" x2="300" y2="245" stroke="#C5C8C6" stroke-width="1.6"/>
  <line x1="180" y1="245" x2="300" y2="245" stroke="#C5C8C6" stroke-width="1.6"/>
  <text x="326" y="180" fill="#F87171" font-size="13">SF36 / UF4007</text>
  <text x="326" y="198" fill="#6B7280" font-size="11">band → +12V side</text>

  <!-- Gate driver: pull-up -->
  <line x1="430" y1="120" x2="430" y2="158" stroke="#C5C8C6" stroke-width="1.6"/>
  <rect x="408" y="158" width="44" height="40" rx="6" fill="none" stroke="#9CA3AF" stroke-width="1.8"/>
  <text x="430" y="182" fill="#C5C8C6" font-size="12" text-anchor="middle">1k</text>
  <line x1="430" y1="198" x2="430" y2="305" stroke="#C5C8C6" stroke-width="1.6"/>
  <circle cx="430" cy="305" r="4" fill="#4B5563"/>
  <line x1="120" y1="305" x2="430" y2="305" stroke="#C5C8C6" stroke-width="1.6"/>
  <text x="458" y="200" fill="#6B7280" font-size="11">pull-up</text>

  <!-- NPN 2N2222 -->
  <rect x="400" y="330" width="60" height="60" rx="8" fill="none" stroke="#34D399" stroke-width="2"/>
  <text x="430" y="356" fill="#34D399" font-size="12" text-anchor="middle">2N2222</text>
  <text x="430" y="374" fill="#6B7280" font-size="10" text-anchor="middle">C top / E bot</text>
  <line x1="430" y1="305" x2="430" y2="330" stroke="#C5C8C6" stroke-width="1.6"/>
  <line x1="430" y1="390" x2="430" y2="420" stroke="#C5C8C6" stroke-width="1.6"/>

  <!-- base resistor from MCU -->
  <line x1="460" y1="360" x2="500" y2="360" stroke="#C5C8C6" stroke-width="1.6"/>
  <rect x="500" y="340" width="44" height="40" rx="6" fill="none" stroke="#9CA3AF" stroke-width="1.8"/>
  <text x="522" y="364" fill="#C5C8C6" font-size="12" text-anchor="middle">1k</text>
  <line x1="544" y1="360" x2="600" y2="360" stroke="#C5C8C6" stroke-width="1.6"/>
  <circle cx="600" cy="360" r="4" fill="#4B5563"/>
  <text x="612" y="356" fill="#E6B450" font-size="12">STM32</text>
  <text x="612" y="372" fill="#E6B450" font-size="12">pin</text>

  <!-- inverted logic note -->
  <text x="28" y="462" fill="#6B7280" font-size="12">Inverted: pin HIGH = coil OFF, pin LOW = coil ON.  Init all pins HIGH at boot.  Firmware auto-shutoff &lt;50 ms per coil.</text>
</svg>
